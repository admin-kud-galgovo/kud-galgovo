<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>U izradi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  .kralus {
    --crvena: #a8132a;
    --nit: #c9b8a0;
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(10px, 2.5vw, 22px);
    padding: 16px; box-sizing: border-box;
    font-family: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) { .kralus { --crvena: #e5505f; --nit: #7a6d5e; } }
  .kralus canvas { width: 100%; max-width: 560px; height: auto; aspect-ratio: 476 / 396; display: block; }
  .kralus h1 {
    margin: 0; color: var(--crvena);
    font-style: italic; font-weight: 400;
    font-size: clamp(2rem, 6vw, 3.4rem); letter-spacing: .01em; line-height: 1;
    display: flex; align-items: baseline; gap: .12em;
  }
  .zrnca { display: inline-flex; gap: .16em; margin-left: .08em; }
  .zrnca i {
    width: .16em; height: .16em; border-radius: 50%;
    background: var(--crvena); opacity: .2;
    animation: zrno 1.5s infinite ease-in-out;
  }
  .zrnca i:nth-child(2) { animation-delay: .25s; }
  .zrnca i:nth-child(3) { animation-delay: .5s; }
  @keyframes zrno { 0%, 100% { opacity: .2; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-.08em); } }
  .nit { width: min(240px, 60%); height: 2px; background: var(--nit); position: relative; border-radius: 1px; }
  .nit span { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--crvena); border-radius: 1px; }
  .nit span::after {
    content: ""; position: absolute; right: -4px; top: 50%; width: 8px; height: 8px;
    margin-top: -4px; border-radius: 50%; background: var(--crvena);
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { .zrnca i { animation: none; opacity: .8; } }
</style>
</head>

  Promise.all([ucitaj(IMG), ucitaj(ORD)]).then(([slika, red]) => {

    const c = document.createElement("canvas"); c.width = W; c.height = H;

    const out = rctx.createImageData(W, H), d = out.data;

      for (let k = 0; k < N; k++) {

        d[i]     = px[i]     + (255 - px[i])     * sjaj;
